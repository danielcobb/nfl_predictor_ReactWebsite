services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nfl-predictor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # --- predictions.db (SQLite, WAL mode) --------------------------------
      # backend/app.py hardcodes DB_PATH next to app.py itself
      # (Path(__file__).resolve().parent / "predictions.db"); it's not
      # configurable via env var without a code change, so these container-side
      # paths must stay exactly "/app/backend/predictions.db*".
      #
      # ONE-TIME SETUP: bind mounts do NOT get seeded from the image (only
      # named volumes do), and the Dockerfile deliberately leaves
      # predictions.db out of the image. Before the first `docker compose up`,
      # create these files on the host yourself, otherwise Docker will create
      # empty directories in their place instead of files:
      #   mkdir -p data
      #   cp backend/predictions.db data/predictions.db
      #   touch data/predictions.db-wal data/predictions.db-shm
      - ./data/predictions.db:/app/backend/predictions.db
      - ./data/predictions.db-wal:/app/backend/predictions.db-wal
      - ./data/predictions.db-shm:/app/backend/predictions.db-shm

      # --- trained model artifacts (backend/main.py's joblib cache) --------
      # This one is baked into the image (backend/model_cache/*.joblib is
      # committed to the repo) and mounted as a named volume rather than a
      # bind mount, so Docker seeds it from the image on first run, then keeps
      # whatever's written/added after that (main.py both reads and writes
      # here) across restarts and rebuilds.
      - model_cache:/app/backend/model_cache

volumes:
  model_cache:
