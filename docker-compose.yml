services:                          # 0 spaces
  backend:                         # 2 spaces
    build:                         # 4 spaces
      context: .
      dockerfile: Dockerfile
    image: nfl-predictor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env                      # DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD (or DATABASE_URL) — see .env.example
    volumes:                       # 4 spaces — backend's volume list
      - model_cache:/app/backend/model_cache

  cloudflared:                     # 2 spaces — sibling of backend
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token YOUR_TUNNEL_TOKEN
    depends_on:
      - backend

volumes:                           # 0 spaces — ROOT level, sibling of "services"
  model_cache